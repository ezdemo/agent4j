version: '1.0'
name: pr-pipeline
displayName: Pull Request Pipeline
triggers:
  trigger: auto
  pr:
    branches:
      include:
        - main
stages:
  - stage:
    name: verify
    displayName: Verify
    strategy: fast
    trigger: auto
    steps:
      - step: build@maven
        name: verify_web_distribution
        displayName: Verify Frontend + Web Distribution
        jdkVersion: 17
        mavenVersion: 3.6.3
        commands:
          - bash .release/ci-sync-web-assets.sh
          - mvn -B -ntp -DskipTests -gs .workflow/maven-central-settings.xml -s .workflow/maven-central-settings.xml clean verify
          - test -f ./loopra-web/target/loopra-web-dist.tar.gz
