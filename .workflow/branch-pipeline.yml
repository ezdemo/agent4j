version: '1.0'
name: branch-pipeline
displayName: Branch Pipeline
triggers:
  trigger: auto
  push:
    branches:
      include:
        - .*
      exclude:
        - main
stages:
  - stage:
    name: verify
    displayName: Verify
    strategy: fast
    trigger: auto
    steps:
      - step: build@maven
        name: build_web_distribution
        displayName: Build Frontend + Package Web Distribution
        jdkVersion: 17
        mavenVersion: 3.6.3
        commands:
          - bash .release/ci-sync-web-assets.sh
          - mvn -B -ntp -DskipTests -gs .workflow/maven-central-settings.xml -s .workflow/maven-central-settings.xml clean verify
          - test -f ./loopra/target/loopra-dist.tar.gz
        artifacts:
          - name: LOOPRA_WEB_DIST
            path:
              - ./loopra/target/loopra-dist.tar.gz
