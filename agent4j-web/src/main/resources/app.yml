solon.app:
  name: "agent4j-web"
  group: "agent4j"
  version: "@project.version@"
version.check.url: "https://gitee.com/api/v5/repos/ezdemo/agent4j/releases/latest"
server:
  port: 4567

solon.logging.appender:
  console:
    enable: true
    level: INFO
    pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) %magenta(${PID:-}) --- %-15([%15.15thread]) %-56(%cyan(%-40.40logger{39}%L)) : %msg%n"
  file:
    pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level ${PID:-} --- %-15([%15.15thread]) %-56(%-40.40logger{39}%L) : %msg%n"
    name: ".agent4j/logs/${solon.app.name}"

solon.mime:
  json: "application/json"

knife4j.enable: true
knife4j.basic.enable: true
knife4j.basic.username: admin
knife4j.basic.password: 123456
knife4j.setting.enableOpenApi: false
knife4j.setting.enableSwaggerModels: false
knife4j.setting.enableFooter: false