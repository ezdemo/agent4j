name: Build & Release

on:
  push:
    branches: [main, master, release/*]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────
  # 每个平台单独构建
  # ──────────────────────────────────────────────
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
            builder_flag: --mac
            artifact_name: Loopra-mac

          - os: ubuntu-latest
            platform: linux
            builder_flag: --linux
            artifact_name: Loopra-linux

          - os: windows-latest
            platform: win32
            builder_flag: --win
            artifact_name: Loopra-win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint || echo 'Lint 有警告，继续构建'

      - name: Build Vite bundles
        run: pnpm run build:vite

      - name: Package with electron-builder
        run: npx electron-builder ${{ matrix.builder_flag }} --publish=never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/
          retention-days: 7

  # ──────────────────────────────────────────────
  # 打 tag 时自动发布 GitHub Release
  # ──────────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Display structure
        run: find release-artifacts -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Loopra ${{ github.ref_name }}
          body: |
            ## Loopra ${{ github.ref_name }}

            请根据你的操作系统下载对应的安装包：

            - **macOS** → `Loopra-mac/*.zip`
            - **Windows** → `Loopra-win/*.exe`
            - **Linux** → `Loopra-linux/*.deb` / `*.rpm`
          draft: true
          prerelease: false
          files: |
            release-artifacts/**/*
