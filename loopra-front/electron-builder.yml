appId: com.loopra.desktop
productName: Loopra
copyright: Copyright © 2024 Loopra Team

directories:
  output: release
  buildResources: build

# Electron 由 electron-builder 自动下载（走 .npmrc 的 electron_mirror），
# 并命中 CI 缓存 ~/.cache/electron；不要配置 electronDist 指向本地 dist，
# 否则 CI 上 node_modules/electron/dist 缺失时打包会直接失败
files:
  - dist/**/*

asar: true

# node-pty 为原生模块（.node），必须从 asar 中解包，否则运行时无法加载
asarUnpack:
  - "**/node_modules/node-pty/**"

# ── macOS ──────────────────────────────────────
mac:
  target:
    - zip
  icon: public/icon-512.png
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false

# ── Windows ────────────────────────────────────
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/favicon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Loopra

# ── Linux ──────────────────────────────────────
linux:
  target:
    - deb
  icon: public/favicon.png
  category: Development
  maintainer: Loopra Team
