name: Build & Release

on:
  push:
    branches: [main, master, release/*]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # 1. Electron 三平台构建
  #    每个平台用对应的原生 Runner 构建，Windows 包不再
  #    依赖 Linux + Wine（替代原云端 electron-pipeline）
  # ──────────────────────────────────────────────
  electron-build:
    needs: [web-dist]
    strategy:
      matrix:
        include:
          - os: macos-latest
            builder_flag: --mac
            artifact_name: Loopra-mac
            upload_pattern: 'loopra-front/release/*.zip'

          - os: ubuntu-latest
            builder_flag: --linux
            artifact_name: Loopra-linux
            upload_pattern: 'loopra-front/release/*.deb'

          - os: windows-latest
            builder_flag: --win
            artifact_name: Loopra-win
            upload_pattern: 'loopra-front/release/*.exe'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Electron
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        working-directory: loopra-front
        run: pnpm install --frozen-lockfile

      - name: Build Vite bundles
        working-directory: loopra-front
        run: pnpm run build:vite

      # 核心运行时（loopra-dist 产物）嵌入前端安装包：用户安装桌面端后无需再下载核心包
      - name: Download loopra dist artifact
        uses: actions/download-artifact@v8
        with:
          name: loopra-dist
          path: web-dist-artifact

      - name: Embed core runtime into installer
        run: bash .release/ci-embed-core.sh web-dist-artifact/loopra-dist.tar.gz

      # macOS 代码签名 + 公证：
      # - 配置了 MAC_CERTIFICATE_P12（Developer ID 证书 base64）时，将其写入
      #   CSC_LINK 交给 electron-builder 自动签名；
      # - 同时配置了 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID 时，
      #   electron-builder 会对产物做 notarization（公证），否则 Gatekeeper 仍会拦截；
      # - 未配置任何凭据时，回退为 ad-hoc 签名（无需 Apple 开发者账户，
      #   electron-builder >= 26.0.12 支持 -c.mac.identity=-）。ad-hoc 签名后
      #   Apple Silicon 上不会出现无法绕过的“已损坏”提示，但 Gatekeeper 仍会
      #   提示“无法验证开发者”，用户首次需右键 → 打开。
      - name: Prepare macOS code signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_P12_PASSWORD: ${{ secrets.MAC_CERTIFICATE_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$MAC_CERTIFICATE_P12" ]; then
            echo "::notice::未配置 MAC_CERTIFICATE_P12，macOS 构建将使用 ad-hoc 签名（无需 Apple 开发者账户；用户首次打开需右键 → 打开）"
            echo "MAC_USE_ADHOC=1" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "MAC_USE_ADHOC=0" >> "$GITHUB_ENV"
          echo "$MAC_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/loopra-mac-cert.p12"
          chmod 600 "$RUNNER_TEMP/loopra-mac-cert.p12"
          echo "CSC_LINK=$RUNNER_TEMP/loopra-mac-cert.p12" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$MAC_CERTIFICATE_P12_PASSWORD" >> "$GITHUB_ENV"
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::warning::Apple 公证凭据不完整（APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID），本次仅签名不公证"
            exit 0
          fi
          echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          echo "::notice::macOS 代码签名与公证凭据已就绪"

      - name: Package with electron-builder
        working-directory: loopra-front
        shell: bash
        env:
          # 无证书时禁止自动发现，避免 runner 上意外使用无效证书导致打包失败
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ "$MAC_USE_ADHOC" = "1" ]; then
            # 无 Developer ID 证书 → 显式 ad-hoc 签名（identity "-" 与 codesign 约定一致）
            npx electron-builder ${{ matrix.builder_flag }} --publish=never -c.mac.identity=-
          else
            npx electron-builder ${{ matrix.builder_flag }} --publish=never
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.upload_pattern }}
          if-no-files-found: error
          retention-days: 7

  # ──────────────────────────────────────────────
  # 2. Web 分发包
  #    前端资产同步 + Maven 打包（与原 master-pipeline 行为一致）
  # ──────────────────────────────────────────────
  web-dist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 脚本依赖 PATH 中的 pnpm（corepack prepare 不会创建 pnpm 命令），
      # 这里显式安装，与 electron-build job 保持一致
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Sync frontend assets
        run: bash .release/ci-sync-web-assets.sh

      - name: Package web distribution
        run: mvn -B -ntp -DskipTests -gs .workflow/maven-central-settings.xml -s .workflow/maven-central-settings.xml clean verify

      - name: Verify artifact
        run: test -f ./loopra/target/loopra-dist.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: loopra-dist
          path: ./loopra/target/loopra-dist.tar.gz
          retention-days: 7

  # ──────────────────────────────────────────────
  # 3. 打 tag（v*）时发布 GitHub Release
  #    生成草稿，确认无误后在 GitHub 页面手动发布
  #    （替代原云端 publish@release_artifacts 手动发布）
  # ──────────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [electron-build, web-dist]
    runs-on: ubuntu-latest

    steps:
      # 必须显式 checkout：本 job 需要仓库内的 .release/npm/loopra-dist
      # （此前缺失导致 npm 发布步骤报 "No such file or directory"）
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: '*'
          merge-multiple: true

      - name: Display structure
        run: find release-artifacts -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Loopra ${{ github.ref_name }}
          body: |
            ## Loopra ${{ github.ref_name }}

            请根据你的操作系统下载对应的安装包：

            - **macOS**（Apple Silicon）→ `Loopra-*.zip`（ad-hoc 签名，首次打开请右键 → 打开）
            - **Windows** → `Loopra Setup *.exe`
            - **Linux** → `loopra-front_*.deb`
            - **Web** → `loopra-dist.tar.gz`
          draft: true
          prerelease: false
          files: |
            release-artifacts/**/*

      # ──────────────────────────────────────────────
      # 4. 同步发布 loopra-dist 到 npm（trusted publishing / OIDC）
      #    版本取 tag 前三段（npm 要求 semver，四段版本号不合法，
      #    与 bump-version.ps1 中 electronVersion 的截取逻辑一致）。
      #    不使用长效 token：npm 将于 2027-01 左右禁掉 2FA-bypass
      #    token 的直接发布，OIDC 发布（--provenance）免费附带
      #    可验证的供应链 provenance。
      # ──────────────────────────────────────────────
      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish loopra-dist to npm
        working-directory: .release/npm/loopra-dist
        run: |
          NPM_VER="$(echo "${GITHUB_REF_NAME#v}" | cut -d. -f1-3)"
          cp "${GITHUB_WORKSPACE}/release-artifacts/loopra-dist.tar.gz" ./loopra-dist.tar.gz
          npm version "$NPM_VER" --no-git-tag-version
          npm publish --provenance
