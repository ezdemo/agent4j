<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Agent4j - AI 代码助手" />
    <title>Agent4j</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }

      #app-loader {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #fff; z-index: 9999; transition: opacity 0.2s;
      }
      [data-theme="dark"] #app-loader { background: #0c0c0c; }

      .loader-icon {
        width: 40px; height: 40px;
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 16px; color: #2563eb;
      }
      .loader-title {
        font-size: 15px; font-weight: 600; color: #111827; margin-bottom: 4px;
      }
      [data-theme="dark"] .loader-title { color: #e5e5e5; }
      .loader-sub {
        font-size: 12px; color: #9ca3af; margin-bottom: 20px;
      }
      .loader-spinner {
        width: 20px; height: 20px;
        border: 2px solid #e5e7eb; border-top-color: #2563eb;
        border-radius: 50%; animation: spin 0.6s linear infinite;
      }
      [data-theme="dark"] .loader-spinner { border-color: #333; border-top-color: #3b82f6; }

      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      #app { height: 100%; }

      ::selection { background: #2563eb; color: #fff; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
      [data-theme="dark"] ::-webkit-scrollbar-thumb { background: #333; }
    </style>
  </head>
  <body>
    <div id="app-loader">
      <div class="loader-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
      </div>
      <div class="loader-title">Agent4j</div>
      <div class="loader-sub">加载中...</div>
      <div class="loader-spinner"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
