appId: com.agent4j.desktop
productName: Agent4j
copyright: Copyright © 2024 Agent4j Team

directories:
  output: release
  buildResources: build

files:
  - dist/**/*

asar: true

# ── macOS ──────────────────────────────────────
mac:
  target:
    - zip
  icon: public/icon-512.png
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false

# ── Windows ────────────────────────────────────
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/favicon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Agent4j

# ── Linux ──────────────────────────────────────
linux:
  target:
    - deb
  icon: public/favicon.png
  category: Development
  maintainer: Agent4j Team
