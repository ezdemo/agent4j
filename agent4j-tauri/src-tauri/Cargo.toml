[package]
name = "agent4j-tauri"
version = "2.0.0"
description = "Agent4j - 桌面端 AI 代码助手"
authors = ["Agent4j Team"]
license = "MIT"
repository = "https://gitee.com/ezdemo/agent4j.git"
edition = "2021"

[lib]
name = "agent4j_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
dirs = "5"
flate2 = "1"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
